name: Flutter checks

on:
  push:
    branches: ["main", "phase-1-foundation"]
  pull_request:
    branches: ["main", "phase-1-foundation"]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
