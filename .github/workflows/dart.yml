name: Validate Flutter code
# Normal pushes run validation; an explicitly prefixed release commit also builds installable APKs.
# Persistent release signing retry after correcting the Base64 keystore secret.

on:
  push:
    branches:
      - feature/first-test-apk
  workflow_dispatch:

concurrency:
  group: khadamat-fanni-android-release
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name khadamat_fanni_hosein --org com.khadamatfanni .
          fi
          # Current Android plugins require compileSdk 36 or newer.
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          else
            echo "Android app Gradle file not found" >&2
            exit 1
          fi
          # Keep the installed launcher label fixed in this build.
          sed -i -E 's/android:label="[^"]*"/android:label="خدمات فنی حسین"/' android/app/src/main/AndroidManifest.xml

      - name: Add app permissions and speech recognition query
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_CONTACTS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="sms" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="tel" />\n        </intent>\n    </queries>' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android launcher icon
        run: dart run flutter_launcher_icons

      - name: Run Flutter unit tests
        run: flutter test

      - name: Align Android plugin compile SDKs
        run: |
          # Some Flutter plugins still declare API 34 in their own Android
          # Gradle files. Raise those module settings to match the app API.
          find "$HOME/.pub-cache/hosted/pub.dev" -path '*/android/build.gradle*' -type f \
            -exec sed -i -E \
            -e 's/(compileSdkVersion|compileSdk)[[:space:]]*(=)?[[:space:]]*34/\1\2 36/g' {} +

      - name: Enable Java API desugaring for notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          path = kts if kts.exists() else groovy
          if not path.exists():
              raise SystemExit("Android app Gradle file not found")
          s = path.read_text()
          if path.suffix == ".kts":
              if "isCoreLibraryDesugaringEnabled" not in s:
                  if "compileOptions {" not in s:
                      raise SystemExit("compileOptions block not found")
                  s = s.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
              if "multiDexEnabled" not in s:
                  if "defaultConfig {" not in s:
                      raise SystemExit("defaultConfig block not found")
                  s = s.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled = true", 1)
              if "coreLibraryDesugaring(" not in s:
                  if "dependencies {" in s:
                      s = s.replace("dependencies {", 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")', 1)
                  else:
                      s += '\ndependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4") }\n'
          else:
              if "coreLibraryDesugaringEnabled" not in s:
                  if "compileOptions {" not in s:
                      raise SystemExit("compileOptions block not found")
                  s = s.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
              if "multiDexEnabled" not in s:
                  if "defaultConfig {" not in s:
                      raise SystemExit("defaultConfig block not found")
                  s = s.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled true", 1)
              if "coreLibraryDesugaring " not in s:
                  if "dependencies {" in s:
                      s = s.replace("dependencies {", "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'", 1)
                  else:
                      s += "\ndependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4' }\n"
          path.write_text(s)
          PY

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos lib

      - name: Configure persistent Android release signing
        if: "${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: build APK')) }}"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Release APKs are not built with temporary Android Debug signing."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          test -s android/app/release-keystore.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=app/release-keystore.jks\n'
          } > android/key.properties

          python3 - <<'PY'
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          path = kts if kts.exists() else groovy
          if not path.exists():
              raise SystemExit("Android app Gradle file not found")

          source = path.read_text()
          if path.suffix == ".kts":
              if "signingProperties" in source or 'create("release")' in source:
                  raise SystemExit("Release signing configuration already exists; refusing to duplicate it")
              source = "import java.util.Properties\n" + source
              prefix = """val signingProperties = Properties()
          val signingPropertiesFile = rootProject.file("key.properties")
          if (!signingPropertiesFile.exists()) {
              throw GradleException("Android release signing properties are missing.")
          }
          signingPropertiesFile.inputStream().use { signingProperties.load(it) }

          """
              if "android {" not in source or "buildTypes {" not in source:
                  raise SystemExit("Unexpected Kotlin Gradle structure; release signing was not changed")
              source = source.replace("android {", prefix + "android {", 1)
              signing = """signingConfigs {
              create("release") {
                  keyAlias = signingProperties.getProperty("keyAlias")
                  keyPassword = signingProperties.getProperty("keyPassword")
                  storeFile = rootProject.file(signingProperties.getProperty("storeFile"))
                  storePassword = signingProperties.getProperty("storePassword")
              }
          }

          """
              source = source.replace("    buildTypes {", "    " + signing.replace("\n", "\n    ").rstrip() + "\n    buildTypes {", 1)
              updated, count = re.subn(
                  r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                  'signingConfig = signingConfigs.getByName("release")',
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Default debug signing declaration was not found")
              source = updated
          else:
              if "signingProperties" in source or "signingConfigs {" in source:
                  raise SystemExit("Release signing configuration already exists; refusing to duplicate it")
              prefix = """def signingProperties = new Properties()
          def signingPropertiesFile = rootProject.file('key.properties')
          if (!signingPropertiesFile.exists()) {
              throw new GradleException('Android release signing properties are missing.')
          }
          signingPropertiesFile.withInputStream { signingProperties.load(it) }

          """
              if "android {" not in source or "buildTypes {" not in source:
                  raise SystemExit("Unexpected Groovy Gradle structure; release signing was not changed")
              source = source.replace("android {", prefix + "android {", 1)
              signing = """signingConfigs {
              release {
                  keyAlias signingProperties['keyAlias']
                  keyPassword signingProperties['keyPassword']
                  storeFile rootProject.file(signingProperties['storeFile'])
                  storePassword signingProperties['storePassword']
              }
          }

          """
              source = source.replace("    buildTypes {", "    " + signing.replace("\n", "\n    ").rstrip() + "\n    buildTypes {", 1)
              updated, count = re.subn(
                  r'signingConfig\s+signingConfigs\.debug',
                  'signingConfig signingConfigs.release',
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Default debug signing declaration was not found")
              source = updated

          path.write_text(source)
          PY

      - name: Build universal release APK
        if: "${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: build APK')) }}"
        run: flutter build apk --release

      - name: Build smaller per-ABI release APKs
        if: "${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: build APK')) }}"
        run: flutter build apk --release --split-per-abi

      - name: Verify APK signatures use one persistent release certificate
        if: "${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: build APK')) }}"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          test -x "$apksigner"
          keystore_fingerprint="$(
            keytool -list -v \
              -keystore android/app/release-keystore.jks \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" |
              sed -n 's/^[[:space:]]*SHA256: //p' |
              head -n 1 |
              tr -d ':' |
              tr '[:lower:]' '[:upper:]'
          )"
          if [ -z "$keystore_fingerprint" ]; then
            echo "::error::Could not read the configured release keystore certificate."
            exit 1
          fi

          for apk in \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk; do
            test -s "$apk"
            "$apksigner" verify --verbose "$apk"
            certificate_report="$("$apksigner" verify --print-certs "$apk" 2>&1)"
            fingerprint="$(printf '%s\n' "$certificate_report" | sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+).*/\1/p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            if ! [[ "$fingerprint" =~ ^[0-9A-F]{64}$ ]]; then
              echo "::error::Could not parse a valid SHA-256 certificate fingerprint from apksigner output: $apk"
              printf '%s\n' "$certificate_report"
              exit 1
            fi
            if [ "$fingerprint" != "$keystore_fingerprint" ]; then
              echo "::error::APK was not signed with the configured persistent release keystore: $apk"
              exit 1
            fi
          done
          echo "All APKs use the configured persistent release certificate: $keystore_fingerprint"

      - name: Upload installable APKs
        if: "${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: build APK')) }}"
        uses: actions/upload-artifact@v4
        with:
          name: khadamat-fanni-hossein-release-apks
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 14
