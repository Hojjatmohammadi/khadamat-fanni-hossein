name: Validate Flutter code
# Pushes run static analysis only. APK builds require a deliberate manual dispatch.

on:
  push:
    branches:
      - feature/first-test-apk
  workflow_dispatch:

concurrency:
  group: khadamat-fanni-android-release
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name khadamat_fanni_hosein --org com.khadamatfanni .
          fi
          # Current Android plugins require compileSdk 36 or newer.
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          else
            echo "Android app Gradle file not found" >&2
            exit 1
          fi
          # Keep the installed launcher label fixed in this build.
          sed -i -E 's/android:label="[^"]*"/android:label="خدمات فنی حسین"/' android/app/src/main/AndroidManifest.xml

      - name: Add app permissions and speech recognition query
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_CONTACTS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="sms" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="tel" />\n        </intent>\n    </queries>' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android launcher icon
        run: dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Run Flutter unit tests
        run: flutter test

      - name: Align Android plugin compile SDKs
        run: |
          # Some Flutter plugins still declare API 34 in their own Android
          # Gradle files. Raise those module settings to match the app API.
          find "$HOME/.pub-cache/hosted/pub.dev" -path '*/android/build.gradle*' -type f \
            -exec sed -i -E \
            -e 's/(compileSdkVersion|compileSdk)[[:space:]]*(=)?[[:space:]]*34/\1\2 36/g' {} +

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos lib

      - name: Build universal release APK
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: flutter build apk --release

      - name: Build smaller per-ABI release APKs
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: flutter build apk --release --split-per-abi

      - name: Upload installable APKs
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: khadamat-fanni-hossein-release-apks
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 14
