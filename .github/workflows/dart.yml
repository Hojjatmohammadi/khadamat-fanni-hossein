name: Build Android APK
# CI build for the latest test-branch revision

on:
  push:
    branches:
      - feature/first-test-apk
  workflow_dispatch:

concurrency:
  group: khadamat-fanni-android-release
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name khadamat_fanni_hosein --org com.khadamatfanni .
          fi

      - name: Add contacts permission
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_CONTACTS" />' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: khadamat-fanni-hossein-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
