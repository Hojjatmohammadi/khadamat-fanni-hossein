name: Pin Flutter dependency versions

on:
  push:
    branches:
      - fix/dashboard-layout-phase2
    paths:
      - .github/workflows/pin-dependencies.yml

permissions:
  contents: write

jobs:
  pin-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve and record exact dependency versions
        run: |
          flutter pub get
          test -s pubspec.lock
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo "Dependency lockfile is already committed; no update needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: pin resolved Flutter dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
