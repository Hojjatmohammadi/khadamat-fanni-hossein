name: Android Emulator Smoke Test

on:
  push:
    branches:
      - fix/dashboard-layout-phase2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate project helpers
        run: |
          python3 -m unittest discover -s tool -p 'test_*.py' -v
          python3 tool/android_version.py

      - name: Generate Android project and verify application identity
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name khadamat_fanni_hossein --org com.khadamatfanni .
          fi
          python3 tool/android_identity.py
          python3 tool/android_manifest.py

      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36"

      - name: Configure Android compile SDK and desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          gradle = groovy if groovy.exists() else kotlin
          if not gradle.exists():
              raise SystemExit("Android app Gradle file was not generated")

          content = gradle.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(?m)^([ \\t]*compileSdk(?:Version)?[ \\t]*(?:=[ \\t]*)?)(?:flutter[.]compileSdkVersion|[0-9]+)([ \\t]*(?:#.*)?$)'
          )
          content, count = pattern.subn(
              lambda match: match.group(1) + "36" + match.group(2),
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not safely set Android compileSdk to 36")

          is_kotlin = gradle.suffix == ".kts"
          enabled = (
              "isCoreLibraryDesugaringEnabled = true"
              if is_kotlin
              else "coreLibraryDesugaringEnabled true"
          )
          dependency = (
              'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              if is_kotlin
              else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          )
          if "coreLibraryDesugaringEnabled" not in content and "isCoreLibraryDesugaringEnabled" not in content:
              content, count = re.subn(
                  r"(compileOptions\\s*\\{)",
                  r"\\1\\n        " + enabled,
                  content,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not find Android compileOptions block")
          if "desugar_jdk_libs" not in content:
              if re.search(r"dependencies\\s*\\{", content):
                  content = re.sub(
                      r"(dependencies\\s*\\{)",
                      r"\\1\\n    " + dependency,
                      content,
                      count=1,
                  )
              else:
                  content += "\\n\\ndependencies {\\n    " + dependency + "\\n}\\n"

          gradle.write_text(content, encoding="utf-8")
          print(f"Configured compileSdk 36 and desugaring in {gradle}")
          PY

      - name: Install Flutter dependencies and verify lockfile
        run: |
          flutter pub get
          git ls-files --error-unmatch pubspec.lock >/dev/null
          git diff --exit-code -- pubspec.lock
          python3 tool/android_compile_sdk.py
          dart run flutter_launcher_icons
          python3 tool/android_launcher_icons.py

      - name: Align flutter_timezone Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          packages = sorted(
              Path.home().joinpath(".pub-cache/hosted/pub.dev").glob(
                  "flutter_timezone-*/android/build.gradle*"
              )
          )
          if not packages:
              raise SystemExit("Could not locate flutter_timezone Android Gradle file")

          def replace_or_add_block(content, block_name, lines):
              pattern = re.compile(
                  r"(?ms)^([ ]*)" + re.escape(block_name) + r"[ ]*\\{.*?^([ ]*)\\}"
              )
              match = pattern.search(content)
              if match:
                  indent, close_indent = match.group(1), match.group(2)
                  body_indent = indent + "    "
                  replacement = (
                      f"{indent}{block_name} {{\\n"
                      + "".join(f"{body_indent}{line}\\n" for line in lines)
                      + f"{close_indent}}}"
                  )
                  return content[:match.start()] + replacement + content[match.end():]
              android = re.search(r"(?m)^([ ]*)android[ ]*\\{", content)
              if not android:
                  raise SystemExit(f"Could not find android block for {block_name}")
              indent = android.group(1) + "    "
              insertion = (
                  "\\n" + indent + block_name + " {\\n"
                  + "".join(indent + "    " + line + "\\n" for line in lines)
                  + indent + "}\\n"
              )
              return content[:android.end()] + insertion + content[android.end():]

          for gradle in packages:
              content = gradle.read_text(encoding="utf-8")
              content = replace_or_add_block(
                  content,
                  "compileOptions",
                  [
                      "sourceCompatibility = JavaVersion.VERSION_11",
                      "targetCompatibility = JavaVersion.VERSION_11",
                  ],
              )
              content = replace_or_add_block(
                  content,
                  "kotlinOptions",
                  ["jvmTarget = JavaVersion.VERSION_11.toString()"],
              )
              gradle.write_text(content, encoding="utf-8")
              print(f"Aligned {gradle} to JVM 11")
          PY

      - name: Run Persian dashboard smoke test on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: flutter test integration_test/material_localizations_test.dart -d emulator-5554 --reporter expanded
