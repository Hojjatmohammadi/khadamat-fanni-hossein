name: Build Android APK
# The generated Android project is upgraded to compileSdk 36 before release builds.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name khadamat_fanni_hossein --org com.khadamatfanni .
          fi

      - name: Enforce stable Android application ID
        run: python3 tool/android_identity.py
      - name: Validate Android update version
        run: python3 tool/android_version.py

      - name: Remove untracked Flutter scaffolding
        run: |
          for generated_file in test/widget_test.dart analysis_options.yaml; do
            if ! git ls-files --error-unmatch "$generated_file" >/dev/null 2>&1; then
              rm -f "$generated_file"
            fi
          done

      - name: Configure and validate Android manifest
        run: python3 tool/android_manifest.py

      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          gradle = groovy if groovy.exists() else kotlin
          if not gradle.exists():
              raise SystemExit("Android app Gradle file was not generated")
          
          content = gradle.read_text(encoding="utf-8")
          pattern = re.compile(r'(?m)^([ \t]*compileSdk(?:Version)?[ \t]*(?:=[ \t]*)?)(?:flutter[.]compileSdkVersion|[0-9]+)([ \t]*(?:#.*)?$)')
          content, count = pattern.subn(lambda match: match.group(1) + "36" + match.group(2), content, count=1)
          if count != 1:
              raise SystemExit("Could not safely set Android compileSdk to 36")
          gradle.write_text(content, encoding="utf-8")
          print(f"Configured compileSdk 36 in {gradle}")
          PY

      - name: Install Android SDK platform 36
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36"

      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          gradle = groovy if groovy.exists() else kotlin
          if not gradle.exists():
              raise SystemExit("Android app Gradle file was not generated")

          content = gradle.read_text(encoding="utf-8")
          is_kotlin = gradle.suffix == ".kts"
          enabled = "isCoreLibraryDesugaringEnabled = true" if is_kotlin else "coreLibraryDesugaringEnabled true"
          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if is_kotlin else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          if "coreLibraryDesugaringEnabled" not in content and "isCoreLibraryDesugaringEnabled" not in content:
              content, count = re.subn(r"(compileOptions\s*\{)", r"\1\n        " + enabled, content, count=1)
              if count != 1:
                  raise SystemExit("Could not find Android compileOptions block")

          if "desugar_jdk_libs" not in content:
              if re.search(r"dependencies\s*\{", content):
                  content = re.sub(r"(dependencies\s*\{)", r"\1\n    " + dependency, content, count=1)
              else:
                  content += "\n\ndependencies {\n    " + dependency + "\n}\n"

          gradle.write_text(content, encoding="utf-8")
          print(f"Enabled core library desugaring in {gradle}")
          PY

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Verify committed dependency lockfile
        run: |
          git ls-files --error-unmatch pubspec.lock >/dev/null
          git diff --exit-code -- pubspec.lock

      - name: Generate and verify branded Android launcher icons
        run: |
          dart run flutter_launcher_icons
          python3 tool/android_launcher_icons.py

      - name: Align flutter_timezone Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          packages = sorted(
              Path.home().joinpath(".pub-cache/hosted/pub.dev").glob(
                  "flutter_timezone-*/android/build.gradle*"
              )
          )
          if not packages:
              raise SystemExit("Could not locate the resolved flutter_timezone Android Gradle file")

          def replace_or_add_block(content, block_name, lines):
              pattern = re.compile(
                  r"(?ms)^([ ]*)" + re.escape(block_name) + r"[ ]*\{.*?^([ ]*)\}"
              )
              match = pattern.search(content)
              if match:
                  indent = match.group(1)
                  close_indent = match.group(2)
                  body_indent = indent + "    "
                  replacement = (
                      f"{indent}{block_name} {{\n"
                      + "".join(f"{body_indent}{line}\n" for line in lines)
                      + f"{close_indent}}}"
                  )
                  return content[:match.start()] + replacement + content[match.end():]
              android = re.search(r"(?m)^([ ]*)android[ ]*\{", content)
              if not android:
                  raise SystemExit(f"Could not find android block for {block_name}")
              indent = android.group(1) + "    "
              insertion = (
                  "\n" + indent + block_name + " {\n"
                  + "".join(indent + "    " + line + "\n" for line in lines)
                  + indent + "}\n"
              )
              pos = android.end()
              return content[:pos] + insertion + content[pos:]

          updated = []
          for gradle in packages:
              content = gradle.read_text(encoding="utf-8")
              content = replace_or_add_block(
                  content,
                  "compileOptions",
                  [
                      "sourceCompatibility = JavaVersion.VERSION_11",
                      "targetCompatibility = JavaVersion.VERSION_11",
                  ],
              )
              content = replace_or_add_block(
                  content,
                  "kotlinOptions",
                  ["jvmTarget = JavaVersion.VERSION_11.toString()"],
              )
              gradle.write_text(content, encoding="utf-8")
              updated.append(str(gradle))

          print("Aligned flutter_timezone Java/Kotlin targets to JVM 11: " + ", ".join(updated))
          PY

      - name: Align file_picker Android compile SDK to 36
        run: python3 tool/android_compile_sdk.py

      - name: Configure permanent release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/android_signing.py

      - name: Build optimized release APKs
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Verify release APK signature
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -s "$APK" ]; then
            echo "Release APK was not created"
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK root was not found"
            exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "Android apksigner was not found"
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload installable APKs and symbol files
        uses: actions/upload-artifact@v4
        with:
          name: khadamat-fanni-hossein-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/symbols/**
          if-no-files-found: error
          retention-days: 14
