name: Build Android APK
# The generated Android project is upgraded to compileSdk 36 before release builds.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name khadamat_fanni_hosein --org com.khadamatfanni .
          fi

      - name: Remove untracked Flutter scaffolding
        run: |
          for generated_file in test/widget_test.dart analysis_options.yaml; do
            if ! git ls-files --error-unmatch "$generated_file" >/dev/null 2>&1; then
              rm -f "$generated_file"
            fi
          done

      - name: Configure app label and notification permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          permission = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          if "android.permission.POST_NOTIFICATIONS" not in content:
              content = content.replace("<application", permission + "\n\n    <application", 1)
          contacts_permission = '    <uses-permission android:name="android.permission.READ_CONTACTS" />'
          if "android.permission.READ_CONTACTS" not in content:
              content = content.replace("<application", contacts_permission + "\n\n    <application", 1)
          boot_permission = '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />'
          if "android.permission.RECEIVE_BOOT_COMPLETED" not in content:
              content = content.replace("<application", boot_permission + "\n\n    <application", 1)
          receiver_lines = [
              '    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />',
              '    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">',
              '        <intent-filter>',
              '            <action android:name="android.intent.action.BOOT_COMPLETED" />',
              '            <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />',
              '            <action android:name="android.intent.action.QUICKBOOT_POWERON" />',
              '            <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />',
              '        </intent-filter>',
              '    </receiver>',
          ]
          if "com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" not in content:
              if "</application>" not in content:
                  raise SystemExit("Could not find the Android application closing tag")
              content = content.replace("</application>", "\n".join(receiver_lines) + "\n    </application>", 1)
          content = re.sub(r'android:label="[^"]*"', 'android:label="خدمات فنی حسین"', content, count=1)
          manifest.write_text(content, encoding="utf-8")
          # Fail early if injected permissions or notification receivers break XML.
          import xml.etree.ElementTree as ET
          ET.parse(manifest)
          PY

      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          gradle = groovy if groovy.exists() else kotlin
          if not gradle.exists():
              raise SystemExit("Android app Gradle file was not generated")
          
          content = gradle.read_text(encoding="utf-8")
          pattern = re.compile(r'(?m)^([ \t]*compileSdk(?:Version)?[ \t]*(?:=[ \t]*)?)(?:flutter[.]compileSdkVersion|[0-9]+)([ \t]*(?:#.*)?$)')
          content, count = pattern.subn(lambda match: match.group(1) + "36" + match.group(2), content, count=1)
          if count != 1:
              raise SystemExit("Could not safely set Android compileSdk to 36")
          gradle.write_text(content, encoding="utf-8")
          print(f"Configured compileSdk 36 in {gradle}")
          PY

      - name: Install Android SDK platform 36
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36"

      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          gradle = groovy if groovy.exists() else kotlin
          if not gradle.exists():
              raise SystemExit("Android app Gradle file was not generated")

          content = gradle.read_text(encoding="utf-8")
          is_kotlin = gradle.suffix == ".kts"
          enabled = "isCoreLibraryDesugaringEnabled = true" if is_kotlin else "coreLibraryDesugaringEnabled true"
          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if is_kotlin else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          if "coreLibraryDesugaringEnabled" not in content and "isCoreLibraryDesugaringEnabled" not in content:
              content, count = re.subn(r"(compileOptions\s*\{)", r"\1\n        " + enabled, content, count=1)
              if count != 1:
                  raise SystemExit("Could not find Android compileOptions block")

          if "desugar_jdk_libs" not in content:
              if re.search(r"dependencies\s*\{", content):
                  content = re.sub(r"(dependencies\s*\{)", r"\1\n    " + dependency, content, count=1)
              else:
                  content += "\n\ndependencies {\n    " + dependency + "\n}\n"

          gradle.write_text(content, encoding="utf-8")
          print(f"Enabled core library desugaring in {gradle}")
          PY

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Align flutter_timezone Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          packages = sorted(
              Path.home().joinpath(".pub-cache/hosted/pub.dev").glob(
                  "flutter_timezone-*/android/build.gradle*"
              )
          )
          if not packages:
              raise SystemExit("Could not locate the resolved flutter_timezone Android Gradle file")

          def replace_or_add_block(content, block_name, lines):
              pattern = re.compile(
                  r"(?ms)^([ ]*)" + re.escape(block_name) + r"[ ]*\{.*?^([ ]*)\}"
              )
              match = pattern.search(content)
              if match:
                  indent = match.group(1)
                  close_indent = match.group(2)
                  body_indent = indent + "    "
                  replacement = (
                      f"{indent}{block_name} {{\n"
                      + "".join(f"{body_indent}{line}\n" for line in lines)
                      + f"{close_indent}}}"
                  )
                  return content[:match.start()] + replacement + content[match.end():]
              android = re.search(r"(?m)^([ ]*)android[ ]*\{", content)
              if not android:
                  raise SystemExit(f"Could not find android block for {block_name}")
              indent = android.group(1) + "    "
              insertion = (
                  "\n" + indent + block_name + " {\n"
                  + "".join(indent + "    " + line + "\n" for line in lines)
                  + indent + "}\n"
              )
              pos = android.end()
              return content[:pos] + insertion + content[pos:]

          updated = []
          for gradle in packages:
              content = gradle.read_text(encoding="utf-8")
              content = replace_or_add_block(
                  content,
                  "compileOptions",
                  [
                      "sourceCompatibility = JavaVersion.VERSION_11",
                      "targetCompatibility = JavaVersion.VERSION_11",
                  ],
              )
              content = replace_or_add_block(
                  content,
                  "kotlinOptions",
                  ["jvmTarget = JavaVersion.VERSION_11.toString()"],
              )
              gradle.write_text(content, encoding="utf-8")
              updated.append(str(gradle))

          print("Aligned flutter_timezone Java/Kotlin targets to JVM 11: " + ", ".join(updated))
          PY

      - name: Align file_picker Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          packages = sorted(Path.home().joinpath(".pub-cache/hosted/pub.dev").glob("file_picker-*/android/build.gradle*"))
          if not packages:
              raise SystemExit("Could not locate the resolved file_picker Android Gradle file")
          updated = []
          for gradle in packages:
              content = gradle.read_text(encoding="utf-8")
              content, count = re.subn(
                  r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)34(\s*(?://.*)?$)",
                  lambda match: match.group(1) + "36" + match.group(2),
                  content,
                  count=1,
              )
              if count:
                  gradle.write_text(content, encoding="utf-8")
                  updated.append(str(gradle))
          if not updated:
              raise SystemExit("file_picker compileSdk was not the expected API 34; refusing an unsafe patch")
          print("Updated file_picker Android compile SDK to 36: " + ", ".join(updated))
          PY

      - name: Configure permanent release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path

          secret_names = (
              "ANDROID_KEYSTORE_BASE64",
              "ANDROID_KEYSTORE_PASSWORD",
              "ANDROID_KEY_ALIAS",
              "ANDROID_KEY_PASSWORD",
          )
          missing = [name for name in secret_names if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  "Release signing is not configured. Add these GitHub Actions secrets: "
                  + ", ".join(missing)
              )

          store_password = os.environ["ANDROID_KEYSTORE_PASSWORD"]
          key_password = os.environ["ANDROID_KEY_PASSWORD"]
          key_alias = os.environ["ANDROID_KEY_ALIAS"]
          if any("\n" in value or "\r" in value for value in (store_password, key_password, key_alias)):
              raise SystemExit("Signing secrets must not contain line breaks")

          try:
              keystore_bytes = base64.b64decode(
                  os.environ["ANDROID_KEYSTORE_BASE64"],
                  validate=True,
              )
          except Exception as error:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 is not valid base64") from error
          if len(keystore_bytes) < 256:
              raise SystemExit("The decoded Android keystore is unexpectedly small")

          keystore_path = Path("android/upload-keystore.jks")
          keystore_path.write_bytes(keystore_bytes)

          keytool = shutil.which("keytool")
          if not keytool:
              raise SystemExit("keytool was not found; Java is required for release signing")
          subprocess.run(
              [
                  keytool, "-list", "-keystore", str(keystore_path),
                  "-storepass", store_password, "-alias", key_alias,
              ],
              check=True,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )

          Path("android/key.properties").write_text(
              "storePassword=" + store_password + "\n"
              + "keyPassword=" + key_password + "\n"
              + "keyAlias=" + key_alias + "\n"
              + "storeFile=upload-keystore.jks\n",
              encoding="utf-8",
          )

          gradle = Path("android/app/build.gradle")
          is_kotlin = False
          if not gradle.exists():
              gradle = Path("android/app/build.gradle.kts")
              is_kotlin = True
          if not gradle.exists():
              raise SystemExit("Android app Gradle file is missing")

          source = gradle.read_text(encoding="utf-8")
          if "keystoreProperties" not in source:
              android_match = re.search(r"(?m)^android\s*\{", source)
              if not android_match:
                  raise SystemExit("Could not locate the Android Gradle block")
              if is_kotlin:
                  loader = (
                      'val keystoreProperties = java.util.Properties()\n'
                      'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                      'if (!keystorePropertiesFile.exists()) throw GradleException("Release key.properties is missing")\n'
                      'keystoreProperties.load(java.io.FileInputStream(keystorePropertiesFile))\n\n'
                  )
              else:
                  loader = (
                      'def keystoreProperties = new java.util.Properties()\n'
                      "def keystorePropertiesFile = rootProject.file('key.properties')\n"
                      'if (!keystorePropertiesFile.exists()) throw new GradleException("Release key.properties is missing")\n'
                      'keystoreProperties.load(new java.io.FileInputStream(keystorePropertiesFile))\n\n'
                  )
              source = source[:android_match.start()] + loader + source[android_match.start():]

          build_types = re.search(r"(?m)^([ \t]*)buildTypes\s*\{", source)
          if not build_types:
              raise SystemExit("Could not locate the Android buildTypes block")
          indent = build_types.group(1)

          if is_kotlin:
              signing_config = (
                  indent + 'signingConfigs {\n'
                  + indent + '    create("release") {\n'
                  + indent + '        keyAlias = keystoreProperties.getProperty("keyAlias")\n'
                  + indent + '        keyPassword = keystoreProperties.getProperty("keyPassword")\n'
                  + indent + '        storeFile = keystoreProperties.getProperty("storeFile")?.let { file(it) }\n'
                  + indent + '        storePassword = keystoreProperties.getProperty("storePassword")\n'
                  + indent + '    }\n'
                  + indent + '}\n\n'
              )
              if not re.search(r"(?m)^\s*signingConfigs\s*\{", source):
                  source = source[:build_types.start()] + signing_config + source[build_types.start():]
              source, count = re.subn(
                  r'(?m)^(\s*)signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)\s*

      - name: Verify release APK signature
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -s "$APK" ]; then
            echo "Release APK was not created"
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "Android apksigner was not found"
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload installable APKs and symbol files
        uses: actions/upload-artifact@v4
        with:
          name: khadamat-fanni-hossein-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/symbols/**
          if-no-files-found: error
          retention-days: 14
,
                  r'\1signingConfig = signingConfigs.getByName("release")',
                  source,
                  count=1,
              )
          else:
              signing_config = (
                  indent + 'signingConfigs {\n'
                  + indent + '    release {\n'
                  + indent + "        keyAlias = keystoreProperties['keyAlias']\n"
                  + indent + "        keyPassword = keystoreProperties['keyPassword']\n"
                  + indent + "        storeFile = file(keystoreProperties['storeFile'])\n"
                  + indent + "        storePassword = keystoreProperties['storePassword']\n"
                  + indent + '    }\n'
                  + indent + '}\n\n'
              )
              if not re.search(r"(?m)^\s*signingConfigs\s*\{", source):
                  source = source[:build_types.start()] + signing_config + source[build_types.start():]
              source, count = re.subn(
                  r'(?m)^(\s*)signingConfig\s*=?\s*signingConfigs\.debug\s*
      - name: Upload installable APKs and symbol files
        uses: actions/upload-artifact@v4
        with:
          name: khadamat-fanni-hossein-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/symbols/**
          if-no-files-found: error
          retention-days: 14
,
                  r'\1signingConfig = signingConfigs.release',
                  source,
                  count=1,
              )

          if count != 1:
              raise SystemExit("Could not safely replace the debug release-signing assignment")
          if (
              'signingConfig = signingConfigs.getByName("release")' not in source
              and "signingConfig = signingConfigs.release" not in source
          ):
              raise SystemExit("Release build is not configured to use the permanent upload key")

          gradle.write_text(source, encoding="utf-8")
          print("Configured the release build to use the validated private keystore.")
          PY

      - name: Build optimized release APKs
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Upload installable APKs and symbol files
        uses: actions/upload-artifact@v4
        with:
          name: khadamat-fanni-hossein-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/symbols/**
          if-no-files-found: error
          retention-days: 14
