name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - fix/dashboard-layout-phase2

# Always validate the newest source. Cancel stale runs so a stalled
# older test cannot block the latest commit in the queue.
concurrency:
  # Keep only the newest run for this development branch active.
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run tests
        timeout-minutes: 20
        run: flutter test --no-pub --reporter expanded


# APK creation is intentionally kept separate and requires an explicit manual request.
