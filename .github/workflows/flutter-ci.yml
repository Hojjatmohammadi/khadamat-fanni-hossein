name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - fix/dashboard-layout-phase2

# Keep the active validation run alive. New pushes may replace a pending run,
# but must never cancel a run that is already testing this branch.
concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run tests
        timeout-minutes: 8
        run: flutter test --no-pub --reporter expanded
