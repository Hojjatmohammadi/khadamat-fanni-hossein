workflows:
  android-apk:
    name: Build Khadamat Fanni Hossein Release APK
    max_build_duration: 60
    environment:
      flutter: stable
      java: 21
    scripts:
      - name: Prepare Android project
        script: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name khadamat_fanni_hosein --org com.khadamatfanni .
          fi
      - name: Get packages
        script: flutter pub get
      - name: Build universal release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
